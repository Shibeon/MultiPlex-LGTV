[package]
name = "plx_base"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "MultiPlex base layer: the event log, file locations, spawn discipline, dlopen seam and frame instruments every other layer builds on."
repository = "https://github.com/GLinnik21/plx-native"
publish = false

[lib]
name = "plx_base"
# An rlib the application crate links, never an archive of its own: the one staticlib is the
# application crate's (ci/test_no_host_staticlib.py holds that line for this crate too).
crate-type = ["rlib"]

[features]
default = []
# Forwarded from the application crate, which is the only one that sets them. Each is named here
# only because some code in this crate has a `cfg` on it.
devtriggers = []
threadcheck = []
lab-diagnostics = []
hostsim = []
# The `cfg(test)` fixtures other crates' tests use, plus the test-mode behaviour (disarmed
# watchdog, no SDL link, the per-process state root) that `cfg(test)` alone cannot give a
# dependent. Enabled from the application crate's `[dev-dependencies]`; never in a shipped build.
test-support = []

[dependencies]
libc = "0.2"
# Watch Together's end-to-end encryption (`crypto`): AES-256-GCM for the session's messages and the
# grant box, P-256 ECDH for the code-less entry. Pure Rust (RustCrypto, Apache-2.0 OR MIT), no
# `getrandom`: every random byte a key or an IV needs is drawn by a runner and handed in, so the
# crates never read the OS themselves. HKDF and base64url are hand-written (`hkdf`, `b64`) over
# `sha256`, so `ecdh`'s own HKDF is linked but unused.
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdh", "arithmetic"] }

[dev-dependencies]
rcgen = "0.14.10"

[lints]
workspace = true
